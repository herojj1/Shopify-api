name = "shopify-fetcher"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
SHOP_API_BASE = "https://shop.app/web/api/catalog/search"
DEFAULT_LIMIT = "100"
MAX_LIMIT = "1000"
PRICE_MIN = "0.10"
PRICE_MAX = "5.00"
